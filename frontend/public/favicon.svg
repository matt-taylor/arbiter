<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradient for gavel head (metallic) -->
    <linearGradient id="gavelHeadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for gavel head highlight -->
    <linearGradient id="gavelHeadHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <!-- Gradient for wood handle -->
    <linearGradient id="handleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#92400e;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#78350f;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#78350f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#451a03;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for sound block base -->
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:1" />
    </linearGradient>
    <!-- Wood grain pattern -->
    <pattern id="woodGrain" patternUnits="userSpaceOnUse" width="4" height="20">
      <rect width="4" height="20" fill="url(#handleGradient)"/>
      <path d="M 0 2 L 4 0 M 0 6 L 4 4 M 0 10 L 4 8 M 0 14 L 4 12 M 0 18 L 4 16"
            stroke="#451a03" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background circle (subtle) -->
  <circle cx="50" cy="50" r="48" fill="#1f2937" stroke="#111827" stroke-width="1.5" opacity="0.8"/>

  <!-- Sound block base -->
  <rect x="25" y="70" width="50" height="12" rx="2" fill="url(#baseGradient)"/>
  <rect x="27" y="72" width="46" height="8" rx="1" fill="#030712" opacity="0.5"/>

  <!-- Gavel handle (wood) -->
  <rect x="48" y="20" width="4" height="52" rx="1" fill="url(#handleGradient)"/>
  <!-- Wood grain texture on handle -->
  <rect x="48" y="20" width="4" height="52" rx="1" fill="url(#woodGrain)" opacity="0.4"/>

  <!-- Gavel head (metallic) -->
  <rect x="35" y="15" width="30" height="12" rx="2" fill="url(#gavelHeadGradient)"/>
  <!-- Gavel head highlight -->
  <rect x="35" y="15" width="30" height="6" rx="2" fill="url(#gavelHeadHighlight)"/>
  <!-- Gavel head edge -->
  <rect x="35" y="15" width="30" height="12" rx="2" fill="none" stroke="#4b5563" stroke-width="0.5"/>

  <!-- Subtle shadow under gavel head -->
  <ellipse cx="50" cy="28" rx="12" ry="2" fill="#000000" opacity="0.2"/>

  <!-- Subtle shine on gavel head -->
  <path d="M 38 18 L 42 17 L 40 21 Z" fill="#ffffff" opacity="0.5"/>

  <!-- Authority accent (subtle divine light) -->
  <circle cx="50" cy="21" r="3" fill="#fbbf24" opacity="0.15"/>
  <circle cx="50" cy="21" r="1.5" fill="#fbbf24" opacity="0.3"/>
</svg>

version: 1
pack: arbiter
common_domains:
  - lan.home.arpa
  - domostack.me

policies:
  - key: arbiter
    name: Arbiter decision Gateway
    description: All request go throuugh arbiter to decide if they can proceed or not
    required_services:
      - gatekeeper
    expand_common_domains: true
    subdomain: arbiter

  - key: killswitch
    name: Killswitch Engine
    description: Killswitch service can block indivudal paths or entire hosts
    required_services:
      - gatekeeper
    expand_common_domains: true
    subdomain: killswitch

  - key: echo
    name: Echo
    description: Echo service is a dummy serivce that just echoes back the request.
    required_services:
      - gatekeeper
      - killswitch
    expand_common_domains: true
    subdomain: echo

  - key: control_plane
    name: Control Plane
    description: Service configuration API and SPA (Rails + Vite). Traffic is checked by Killswitch and authorized via Gatekeeper.
    required_services:
      - gatekeeper
      - killswitch
    expand_common_domains: true
    subdomain: control

  - key: control_plane_jobs
    name: Control Plane Jobs
    description: Mission Control (Jobs UI) for the control plane.
    required_services:
      - gatekeeper
      - killswitch
    expand_common_domains: true
    subdomain: control-jobs

  - key: homeassistant
    name: Home Assistant
    description: Home assistant is a home automation platform
    required_services: ["killswitch"]
    expand_common_domains: true
    subdomain: ha

  - key: lgtm
    name: Observability platform
    description: LGTM is the observability platform for the domostack. Collects logs and metrics from all LXC's
    required_services: ["killswitch"]
    expand_common_domains: true
    subdomain: lgtm

  - key: proxmox
    name: Proxmox
    description: Proxmox is the virtualization platform for the domostack. It manages the virtual machines and containers.
    required_services: ["killswitch"]
    expand_common_domains: true
    subdomain: proxmox

  - key: tandoor
    name: Tandoor
    description: Tandoor is the recipe management platform for the domostack. It manages the recipes and ingredients.
    required_services: ["killswitch"]
    expand_common_domains: true
    subdomain: tandoor

  - key: short
    name: Short
    description: Short is the URL shortening platform for the domostack. It shortens the URLs and redirects to the original URL.
    required_services: ["killswitch"]
    expand_common_domains: true
    subdomain: short

  - key: gatekeeper
    name: Gatekeeper Authorization Engine
    description: Gatekeeper service can block requests based on user identity
    required_services: []
    expand_common_domains: true
    subdomain: gatekeeper

  - key: doublefloor
    name: Doublefloor
    description: Doublefloor
    required_services: ["killswitch"]
    hosts: ["doublefloor.me"]
